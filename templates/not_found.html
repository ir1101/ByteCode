{% extends "site_base.html" %}
{% block title %}{{ code }} · MiniLang{% endblock %}

{% block main %}
<div class="lost">
  <section class="win is-light" aria-labelledby="lost-title">
    <div class="win-bar">
      <span class="win-handle" aria-hidden="true"></span>
      <p class="win-title" aria-hidden="true">[Error/{{ code }}]</p>
      <span class="win-btn" aria-hidden="true"></span>
    </div>
    <div class="win-body">
      <h1 id="lost-title" class="lost-title">{{ "Page not found" if code == 404 else "Something went wrong" }}</h1>
      <p class="win-note">{{ message }}</p>
      <div class="win-actions">
        <a class="link-btn" href="{{ url_for('landing') }}"><span>Home</span><span class="arrow" aria-hidden="true">↗</span></a>
        <a class="link-btn is-primary" href="{{ url_for('playground') }}"><span>Playground</span><span class="arrow" aria-hidden="true">↗</span></a>
      </div>
    </div>
  </section>
</div>
{% endblock %}
